<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>GPUixUI live surface</title>
    <style>
      /*
       * The reference browser example's chrome: GPUI appends its own canvas to
       * <body>, so the document must be exactly one viewport with no scroll and
       * a canvas that fills it. The app paints every pixel itself.
       */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      [data-gpuix-status] {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        color: #6b7280;
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div data-gpuix-status>Starting the GPUix surface…</div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(
      "#t-window",
      { opacity: 0, filter: "blur(8px)", scale: 0.97 },
      {
        opacity: 1,
        filter: "blur(0px)",
        scale: 1,
        duration: 0.28,
        ease: "expo.out",
      },
      0.0,
    );
    const command = "nub run dev settings --terminal";
    const typed = document.querySelector("#t-typed");
    tl.call(() => (typed.textContent = ""), null, 0);
    [...command].forEach((_, i) =>
      tl.call(
        () => (typed.textContent = command.slice(0, i + 1)),
        null,
        0.1 + i * 0.018,
      ),
    );
    tl.set("#t-prompt", { opacity: 1 }, 0);
    tl.set("#t-prompt", { opacity: 0 }, 1.0);
    // The repaint lands at 1.73 (beat 3); terminal-take.ts measured it.
    // The Dark mode switch: (967, 150) in the 1024 px terminal frame, at 1440/1024.
    const target = { x: 1599.8, y: 538.9 };
    tl.fromTo(
      "#t-cur",
      { x: 1760, y: 1000, opacity: 0, scale: 1 },
      {
        x: target.x,
        y: target.y,
        opacity: 1,
        duration: 0.5,
        ease: "power3.inOut",
      },
      1.0,
    );
    tl.to("#t-cur", { scale: 0.86, duration: 0.066 }, 1.63);
    tl.to("#t-cur", { scale: 1, duration: 0.12 }, 1.76);
    tl.to(
      "#t-window, #t-cur",
      { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" },
      2.118,
    );
    // Lines arrive grey-to-ink with a 6 px blur, hold still, leave with a blur.
    document.querySelectorAll("#root .cap").forEach((el) => {
      const start = Number(el.dataset.start);
      const end = start + Number(el.dataset.duration);
      tl.fromTo(
        el.querySelector("span"),
        { opacity: 0.3, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" },
        start,
      );
      tl.to(
        el.querySelector("span"),
        { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" },
        end - 0.2,
      );
    });
    window.__timelines["terminal"] = tl;
  </script>

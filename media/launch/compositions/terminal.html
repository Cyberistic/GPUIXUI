  <script>
    const tl = gsap.timeline({ paused: true });
    // In: the window arrives on the same ground the Settings window left.
    tl.fromTo(
      "#t-window",
      { opacity: 0, scale: 0.94, filter: "blur(8px)" },
      {
        opacity: 1,
        scale: 1,
        filter: "blur(0px)",
        duration: 0.35,
        ease: "expo.out",
      },
      0,
    );
    // The command, one character a keystroke (sound: key-0..3).
    const command = "nub run terminal";
    const typed = document.querySelector("#t-typed");
    [...command].forEach((_, i) =>
      tl.call(
        () => (typed.textContent = command.slice(0, i + 1)),
        null,
        0.25 + i * 0.045,
      ),
    );
    tl.call(() => (typed.textContent = ""), null, 0);
    tl.set("#t-prompt", { opacity: 1 }, 0);
    tl.set("#t-prompt", { opacity: 0 }, 1.3);
    // The cursor comes in for the Dark mode switch: pressed 2.6, released 2.73
    // (the terminal repaints at 2.7; see apps/playground/src/film/terminal-take.ts).

    tl.fromTo(
      "#t-cur",
      { x: 1760, y: 1000, scale: 1, opacity: 0 },
      {
        x: target.x,
        y: target.y,
        opacity: 1,
        duration: 0.6,
        ease: "power3.inOut",
      },
      1.9,
    );
    tl.to("#t-cur", { scale: 0.86, duration: 0.066 }, 2.6);
    tl.to("#t-cur", { scale: 1, duration: 0.13 }, 2.73);
    tl.to(
      "#t-cur",
      {
        x: target.x + 40,
        y: target.y + 70,
        duration: 0.6,
        ease: "power2.inOut",
      },
      2.9,
    );
    // Out: a blur swap into the Omarchy desktop.
    tl.to(
      ["#t-window", "#t-cur"],
      { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" },
      3.28,
    );
    tl.fromTo(
      "#t-cap span",
      { opacity: 0.3, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" },
      1.25,
    );
    tl.to(
      "#t-cap span",
      { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" },
      3.13,
    );
    window.__timelines["terminal"] = tl;

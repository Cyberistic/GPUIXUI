    const tl = gsap.timeline({ paused: true });
    const cam = { z: Math.log(2.1) };
    const zoom = () => gsap.set("#g-cam", { scale: Math.exp(cam.z) });
    // It opens on one tile, not on the page's seam: the montage's last close-up

    // same shape, same size, same place in the frame — then pulls back.
    gsap.set("#g-wall", { x: -1416, y: -607 });
    tl.to(
      "#g-wall",
      { x: -1060, y: -168, duration: 2.9, ease: "power2.inOut" },
      0,
    );
    zoom();
    tl.to(
      cam,
      { z: 0, duration: 2.9, ease: "power2.inOut", onUpdate: zoom },
      0,
    );
    // The page arrives a beat after the camera: the title block settles once the
    // wall has given it room, and the cards drift inside their frames after that.
    tl.fromTo(
      "#g-hero",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      1.4,
    );
    gsap.utils.toArray("#g-wall .tile").forEach((tile, i) => {
      const img = tile.querySelector("img");
      if (!img) return;
      const dx = (i % 3) - 1;
      const dy = ((i + 1) % 3) - 1;
      tl.fromTo(
        img,
        { x: 0, y: 0 },
        {
          x: dx * 7,
          y: dy * 6,
          duration: 1.8,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        2.2 + (i % 5) * 0.06,
      );
    });
    tl.fromTo("#g-wall", { rotation: 0 }, { rotation: 0, duration: 4.5 }, 0);
    tl.set({}, {}, 4.5);
    window.__timelines = window.__timelines || {};
    window.__timelines["grid"] = tl;

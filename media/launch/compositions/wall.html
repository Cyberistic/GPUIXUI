  <script>
    const tl = gsap.timeline({ paused: true });
    // The plane tilts back and turns; the camera travels across it in one move.
    tl.fromTo(
      "#w-plane",
      { rotateX: 28, rotateY: -18, rotateZ: 6, x: 520, y: 40 },
      {
        rotateX: 22,
        rotateY: -12,
        rotateZ: 4,
        x: -380,
        y: 20,
        duration: 4.615,
        ease: "power1.inOut",
      },
      0,
    );
    tl.fromTo("#w-plane", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0);
    tl.to("#w-plane", { opacity: 0, duration: 0.18, ease: "power2.in" }, 4.425);
    // Lines arrive grey-to-ink with a 6 px blur, hold still, leave with a blur.
    document.querySelectorAll("#root .cap").forEach((el) => {
      const start = Number(el.dataset.start);
      const end = start + Number(el.dataset.duration);
      tl.fromTo(
        el.querySelector("span"),
        { opacity: 0.3, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" },
        start,
      );
      tl.to(
        el.querySelector("span"),
        { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" },
        end - 0.2,
      );
    });
    window.__timelines["wall"] = tl;
  </script>

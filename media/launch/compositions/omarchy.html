  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#o-screen", { opacity: 0, filter: "blur(8px)", scale: 0.97 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.28, ease: "expo.out" }, 0.0);
